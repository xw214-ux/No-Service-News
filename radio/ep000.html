<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="0;url=index.html">
<title>Radio — NO SERVICE</title>
<style>
:root {
  --accent: #65ffb4;
  --accent-2: #9b7cff;
  --bg: #080b0a;
  --bg-2: #0d1210;
  --card: #101614;
  --card-2: #151314;
  --ink: #ecebe4;
  --dim: #9aa097;
  --muted: #666d68;
  --line: #27312d;
  --shadow: rgba(0, 0, 0, .36);
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0;
  min-height: 100vh;
  background:
    linear-gradient(rgba(101,255,180,.018) 1px, transparent 1px) 0 0 / 100% 5px,
    linear-gradient(90deg, rgba(155,124,255,.034), transparent 24%, transparent 76%, rgba(101,255,180,.032)),
    radial-gradient(ellipse at top, #13201b 0%, #080b0a 58%);
  color: var(--ink);
  font: 16px/1.65 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  padding-bottom: 104px;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  opacity: .18;
  background:
    linear-gradient(180deg, rgba(8,11,10,.55), transparent 18%, transparent 70%, rgba(8,11,10,.72)),
    repeating-linear-gradient(90deg, rgba(255,255,255,.026) 0 1px, transparent 1px 5px),
    repeating-linear-gradient(0deg, rgba(0,0,0,.24) 0 1px, transparent 1px 3px);
  mix-blend-mode: screen;
}
body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  opacity: .1;
  background:
    radial-gradient(circle at 18% 10%, rgba(101,255,180,.16), transparent 22%),
    radial-gradient(circle at 84% 22%, rgba(155,124,255,.12), transparent 24%);
  filter: blur(22px);
}
.wrap {
  position: relative;
  z-index: 1;
  width: min(1120px, calc(100% - 36px));
  margin: 0 auto;
  padding: 18px 0 96px;
}
header.site {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 18px;
  border-bottom: 1px solid var(--line);
  padding: 26px 0 14px;
  margin-bottom: 10px;
}
header.site h1 {
  margin: 0;
  font-size: clamp(28px, 5vw, 64px);
  line-height: .88;
  letter-spacing: .08em;
  text-transform: uppercase;
}
header.site h1 a { color: var(--ink); text-decoration: none; }
header.site .tag {
  max-width: 420px;
  color: var(--dim);
  font-size: 12px;
  letter-spacing: .13em;
  text-transform: uppercase;
  text-align: right;
}
nav.top {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin: 12px 0 32px;
  font-size: 12px;
  letter-spacing: .12em;
  text-transform: uppercase;
}
nav.top a {
  color: var(--dim);
  text-decoration: none;
  border: 1px solid var(--line);
  background: rgba(16,22,20,.72);
  padding: 5px 9px;
}
nav.top a:hover { color: var(--accent); border-color: var(--accent); }
h1,h2,h3,h4 { line-height: 1.15; }
h1 { font-size: clamp(34px, 7vw, 76px); letter-spacing: .02em; margin: 28px 0 12px; }
h2 { font-size: clamp(22px, 3vw, 34px); margin: 30px 0 10px; }
h3 { font-size: 18px; margin: 20px 0 8px; }
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 3px; }
p { max-width: 72ch; color: #d8dbd2; }
.post-card {
  background: linear-gradient(180deg, rgba(21,19,20,.92), rgba(11,15,13,.96));
  border: 1px solid var(--line);
  border-radius: 0;
  box-shadow: 0 14px 40px var(--shadow);
  padding: 18px 20px;
  margin: 0 0 12px;
}
.post-card h2 { margin: 4px 0 4px; font-size: 22px; }
.post-card h2 a { color: var(--ink); text-decoration: none; }
.post-card h2 a:hover { color: var(--accent); }
.meta, .count, .src {
  color: var(--dim);
  font-size: 12px;
  letter-spacing: .12em;
  text-transform: uppercase;
}
.meta .scout { color: var(--accent); font-weight: 700; }
.excerpt { color: #cbd0c6; font-size: 14.5px; margin-top: 8px; max-width: 82ch; }
article.post { max-width: 820px; }
article.post p { color: #d8dbd2; }
.track {
  background: linear-gradient(180deg, rgba(21,19,20,.92), rgba(11,15,13,.96));
  border: 1px solid var(--line);
  border-left: 3px solid var(--accent);
  border-radius: 0;
  box-shadow: 0 14px 40px var(--shadow);
  padding: 14px 16px;
  margin: 14px 0;
}
.track-head { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.artist { font-weight: 750; }
.title { color: #d6d9d0; }
.note { color: #cbd0c6; font-size: 14px; margin-top: 6px; }
.badge {
  display: inline-block;
  font-size: 11px;
  letter-spacing: .09em;
  text-transform: uppercase;
  border: 1px solid var(--line);
  color: var(--dim);
  border-radius: 0;
  padding: 2px 8px;
  margin-left: 6px;
}
.badge.underdog { border-color: var(--accent); color: var(--accent); }
.player { margin-top: 10px; }
.player iframe, iframe { border-radius: 0; }
.links { margin-top: 10px; }
.btn {
  display: inline-block;
  color: var(--ink);
  background: rgba(16,22,20,.74);
  border: 1px solid var(--line);
  border-radius: 0;
  padding: 7px 12px;
  margin-right: 8px;
  font-size: 12px;
  letter-spacing: .1em;
  text-transform: uppercase;
  text-decoration: none;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.dl { border-color: var(--accent); color: var(--accent); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
td, th { border-bottom: 1px solid var(--line); padding: 8px; text-align: left; }
th { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .09em; }
footer {
  margin-top: 60px;
  color: var(--muted);
  font-size: 12px;
  border-top: 1px solid var(--line);
  padding-top: 16px;
  letter-spacing: .08em;
  text-transform: uppercase;
}
pre { background: #0b0f0d; border: 1px solid var(--line); border-radius: 0; padding: 12px; overflow-x: auto; font-size: 13px; }
code { background: #0b0f0d; padding: 1px 5px; border-radius: 0; font-size: .92em; }
hr { border: 0; border-top: 1px solid var(--line); margin: 28px 0; }

#ns-bar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 99;
  background:
    linear-gradient(rgba(101,255,180,.018) 1px, transparent 1px) 0 0 / 100% 4px,
    #0f1412;
  border-top: 2px solid var(--accent);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 14px;
  flex-wrap: wrap;
  box-shadow: 0 -18px 40px rgba(0,0,0,.42);
}
#ns-bar .nsbtn {
  cursor: pointer;
  font-size: 13px;
  color: var(--ink);
  background: rgba(16,22,20,.74);
  border: 1px solid var(--line);
  border-radius: 0;
  padding: 5px 12px;
}
#ns-bar .nsbtn:hover { border-color: var(--accent); color: var(--accent); }
#ns-now {
  color: var(--dim);
  font-size: 12.5px;
  flex: 1;
  min-width: 140px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  letter-spacing: .08em;
  text-transform: uppercase;
}
#ns-frame { width: 340px; height: 64px; border: 0; border-radius: 0; display: none; }
@media (max-width: 760px) {
  .wrap { width: min(100% - 28px, 1120px); }
  header.site { display: block; }
  header.site .tag { text-align: left; margin-top: 8px; }
  h1 { font-size: clamp(34px, 14vw, 66px); }
  #ns-frame { width: 100%; }
}
</style>
</head><body><div class="wrap">
<header class="site">
  <h1><a href="index.html">NO SERVICE</a></h1>
  <div class="tag">underground signal · radio notes · pressure archive</div>
</header>
<nav class="top"><a href="index.html">Radio</a><a href="../index.html">Feed</a></nav>
<h1>Radio</h1>
<p class="count">Redirecting to the radio archive. <a href="index.html">Open No Service Radio</a>.</p>
</div></body></html>
