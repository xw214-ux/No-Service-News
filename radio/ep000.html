<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="0;url=index.html">
<title>Radio — NO SERVICE</title>
<style>
:root {
  --accent: #ff4d00;
  --signal: #65ffb4;
  --violet: #9b7cff;
  --bg: #0c0c0e;
  --bg-2: #101012;
  --card: #16161a;
  --card-2: #111114;
  --ink: #e8e6e1;
  --soft: #c9c6bf;
  --dim: #8a8780;
  --line: #29292f;
  --shadow: rgba(0, 0, 0, .34);
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0;
  min-height: 100vh;
  background:
    linear-gradient(rgba(255,77,0,.018) 1px, transparent 1px) 0 0 / 100% 7px,
    radial-gradient(circle at 18% 0%, rgba(101,255,180,.08), transparent 26%),
    radial-gradient(circle at 86% 10%, rgba(155,124,255,.075), transparent 26%),
    linear-gradient(180deg, #111114 0%, var(--bg) 38%, #09090a 100%);
  color: var(--ink);
  font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  padding-bottom: 100px;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  opacity: .12;
  background:
    repeating-linear-gradient(0deg, rgba(255,255,255,.04) 0 1px, transparent 1px 4px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.02) 0 1px, transparent 1px 7px);
  mix-blend-mode: screen;
}
.wrap {
  position: relative;
  z-index: 1;
  max-width: 820px;
  margin: 0 auto;
  padding: 24px 18px 86px;
}
header.site {
  border-bottom: 2px solid var(--accent);
  padding: 28px 0 14px;
  margin-bottom: 6px;
}
header.site h1 {
  margin: 0;
  font-size: clamp(30px, 5.6vw, 48px);
  line-height: .95;
  letter-spacing: .14em;
  text-transform: uppercase;
}
header.site h1 a { color: var(--ink); text-decoration: none; }
header.site .tag {
  color: var(--dim);
  font-size: 13px;
  letter-spacing: .06em;
  margin-top: 6px;
}
nav.top {
  display: flex;
  flex-wrap: wrap;
  gap: 0 16px;
  margin: 10px 0 26px;
  font-size: 13px;
  letter-spacing: .07em;
  text-transform: uppercase;
}
nav.top a { color: var(--dim); text-decoration: none; }
nav.top a:hover { color: var(--accent); }
h1,h2,h3,h4 { line-height: 1.25; }
h1 { font-size: clamp(32px, 6vw, 58px); margin: 30px 0 14px; letter-spacing: .01em; }
h2 { font-size: clamp(21px, 3.2vw, 30px); margin: 28px 0 8px; }
h3 { font-size: 18px; margin: 18px 0 6px; }
a { color: var(--accent); text-underline-offset: 3px; }
p { color: #d6d3cc; max-width: 72ch; }
.station-panel {
  position: relative;
  overflow: hidden;
  background:
    linear-gradient(90deg, rgba(255,77,0,.15), transparent 34%),
    linear-gradient(180deg, rgba(22,22,26,.98), rgba(12,12,14,.98));
  border: 1px solid var(--line);
  border-left: 3px solid var(--accent);
  border-radius: 8px;
  box-shadow: 0 18px 50px var(--shadow);
  padding: 20px;
  margin: 0 0 18px;
}
.station-panel::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: .16;
  background:
    linear-gradient(90deg, rgba(101,255,180,.18), transparent 22%, transparent 72%, rgba(155,124,255,.16)),
    repeating-linear-gradient(0deg, transparent 0 5px, rgba(255,255,255,.04) 5px 6px);
}
.station-panel > * { position: relative; z-index: 1; }
.station-panel h2 { margin: 4px 0 8px; font-size: clamp(25px, 4.4vw, 40px); }
.station-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  margin-top: 14px;
}
.station-stat {
  border: 1px solid var(--line);
  background: rgba(17,17,20,.72);
  border-radius: 6px;
  padding: 10px;
}
.station-stat strong {
  display: block;
  color: var(--ink);
  font-size: 15px;
  line-height: 1.2;
}
.station-stat span {
  display: block;
  color: var(--dim);
  font-size: 11px;
  letter-spacing: .08em;
  text-transform: uppercase;
  margin-top: 4px;
}
.post-card {
  background: linear-gradient(180deg, rgba(22,22,26,.96), rgba(17,17,20,.96));
  border: 1px solid var(--line);
  border-radius: 8px;
  box-shadow: 0 10px 30px rgba(0,0,0,.2);
  padding: 18px 20px;
  margin: 0 0 18px;
}
.post-card h2 { margin: 0 0 4px; font-size: 20px; }
.post-card h2 a { color: var(--ink); text-decoration: none; }
.post-card h2 a:hover { color: var(--accent); }
.meta, .count, .src {
  color: var(--dim);
  font-size: 12.5px;
  letter-spacing: .08em;
  text-transform: uppercase;
}
.meta .scout { color: var(--accent); font-weight: 700; }
.excerpt { color: var(--soft); font-size: 14.5px; margin-top: 8px; }
article.post { max-width: 780px; }
article.post p { color: #d6d3cc; }
.track {
  background: linear-gradient(180deg, rgba(22,22,26,.96), rgba(17,17,20,.96));
  border: 1px solid var(--line);
  border-left: 3px solid var(--accent);
  border-radius: 8px;
  padding: 14px 16px;
  margin: 14px 0;
}
.track-head { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.artist { font-weight: 700; }
.title { color: #d6d3cc; }
.note { color: var(--soft); font-size: 14px; margin-top: 6px; }
.badge {
  display: inline-block;
  font-size: 11px;
  letter-spacing: .08em;
  text-transform: uppercase;
  border: 1px solid var(--line);
  color: var(--dim);
  border-radius: 99px;
  padding: 2px 9px;
  margin-left: 6px;
}
.badge.underdog { border-color: var(--accent); color: var(--accent); }
.player { margin-top: 10px; }
.player iframe { border-radius: 6px; }
.links { margin-top: 10px; }
.btn {
  display: inline-block;
  font-size: 13px;
  text-decoration: none;
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 5px 12px;
  margin: 8px 8px 0 0;
  background: rgba(17,17,20,.72);
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.dl { border-color: var(--accent); color: var(--accent); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
td, th { border-bottom: 1px solid var(--line); padding: 7px 8px; text-align: left; }
th { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .07em; }
footer {
  margin-top: 60px;
  color: var(--dim);
  font-size: 12.5px;
  border-top: 1px solid var(--line);
  padding-top: 16px;
}
pre { background: #111114; border: 1px solid var(--line); border-radius: 8px; padding: 12px; overflow-x: auto; font-size: 13px; }
code { background: #111114; padding: 1px 5px; border-radius: 4px; font-size: .92em; }
hr { border: 0; border-top: 1px solid var(--line); margin: 28px 0; }

#ns-bar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 99;
  background:
    linear-gradient(90deg, rgba(101,255,180,.07), transparent 30%, rgba(155,124,255,.05)),
    #131316;
  border-top: 2px solid var(--accent);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 14px;
  flex-wrap: wrap;
  box-shadow: 0 -16px 36px rgba(0,0,0,.35);
}
#ns-bar .nsbtn {
  cursor: pointer;
  font-size: 13px;
  color: var(--ink);
  background: none;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 5px 12px;
}
#ns-bar .nsbtn:hover { border-color: var(--accent); color: var(--accent); }
#ns-now {
  color: var(--dim);
  font-size: 12.5px;
  flex: 1;
  min-width: 140px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#ns-frame { width: 340px; height: 64px; border: 0; border-radius: 6px; display: none; }
@media (max-width: 700px) {
  .wrap { padding-inline: 16px; }
  .station-grid { grid-template-columns: 1fr; }
  #ns-frame { width: 100%; }
}
</style>
</head><body><div class="wrap">
<header class="site">
  <h1><a href="index.html">NO SERVICE</a></h1>
  <div class="tag">sound-system weight · meditative pressure · underdog signal</div>
</header>
<nav class="top"><a href="index.html">Radio</a><a href="../index.html">Feed</a></nav>
<h1>Radio</h1>
<p class="count">Redirecting to the radio archive. <a href="index.html">Open No Service Radio</a>.</p>
</div></body></html>
